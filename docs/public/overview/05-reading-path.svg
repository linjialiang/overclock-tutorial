  <text x="480" y="384" text-anchor="middle" font-family="'Noto Sans SC','Source Han Sans SC','Microsoft YaHei',sans-serif" font-size="20" fill="#8FA3AD">原理篇不绑定平台；工具篇只讲怎么用；案例篇保留真实数据。</text>
