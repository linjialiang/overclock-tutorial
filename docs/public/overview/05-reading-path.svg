<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" role="img" aria-labelledby="fig05-title fig05-desc">
  <title id="fig05-title">这份教程怎么读</title>
  <desc id="fig05-desc">阅读路径分四步：先读概述建立对象与四道墙的框架，再按问题跳读原理篇九章，动手时按工具篇的界面说明跑测试读读数，最后对照案例篇的真实配置与读数。</desc>
