<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-labelledby="fig01-title fig01-desc">
  <title id="fig01-title">超频在超什么</title>
  <desc id="fig01-desc">CPU、内存、核显三个显性超频对象与缓存 Ring 一个隐性对象，列出各自调节的量、典型 BIOS 入口和频率刻度位置。</desc>
  <defs>
    <pattern id="fig01-grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#1B262C"/>
    </pattern>
    <pattern id="fig01-grid-major" width="96" height="96" patternUnits="userSpaceOnUse">
      <path d="M96 0H0V96" fill="none" stroke="#233139"/>
    </pattern>
  </defs>

  <rect width="960" height="560" rx="18" fill="#0E1317"/>
  <rect width="960" height="560" rx="18" fill="url(#fig01-grid)"/>
  <rect width="960" height="560" rx="18" fill="url(#fig01-grid-major)"/>
  <rect x="0.5" y="0.5" width="959" height="559" rx="18" fill="none" stroke="#2A3A43"/>

  <text x="48" y="50" font-family="'JetBrains Mono','Cascadia Mono',Consolas,monospace" font-size="20" fill="#F0A03C" letter-spacing="1">FIG.01</text>
  <text x="134" y="51" font-family="'Noto Sans SC','Source Han Sans SC','Microsoft YaHei',sans-serif" font-size="24" fill="#E6EDF1">超频在超什么</text>
  <text x="912" y="50" text-anchor="end" font-family="'JetBrains Mono','Cascadia Mono',Consolas,monospace" font-size="18" fill="#8FA3AD">01 / 06</text>
  <path d="M48 72H912" stroke="#2A3A43"/>

  <!-- Row 1 CPU -->
  <rect x="48" y="100" width="864" height="86" rx="12" fill="#131C21" stroke="#26343C"/>
  <rect x="50" y="116" width="4" height="54" rx="2" fill="#F0A03C"/>
  <text x="76" y="139" font-family="'JetBrains Mono','Cascadia Mono',Consolas,monospace" font-size="26" fill="#E6EDF1">CPU</text>
  <text x="76" y="164" font-family="'Noto Sans SC','Source Han Sans SC','Microsoft YaHei',sans-serif" font-size="17" fill="#8FA3AD">处理器</text>
  <text x="244" y="139" font-family="'Noto Sans SC','Source Han Sans SC','Microsoft YaHei',sans-serif" font-size="24" fill="#E6EDF1">倍频 / 外频</text>
  <text x="244" y="164" font-family="'Noto Sans SC','Source Han Sans SC','Microsoft YaHei',sans-serif" font-size="17" fill="#8FA3AD">决定核心频率</text>
  <text x="516" y="144" font-family="'JetBrains Mono','Cascadia Mono',Consolas,monospace" font-size="17" fill="#8FA3AD">CPU Core Ratio / BCLK</text>
  <line x1="760" y1="143" x2="884" y2="143" stroke="#33454F" stroke-width="6" stroke-linecap="round"/>
  <circle cx="796" cy="143" r="5" fill="#566B76"/>
  <rect x="802" y="137" width="66" height="12" rx="6" fill="#F0A03C"/>

  <!-- Row 2 Memory -->
  <rect x="48" y="198" width="864" height="86" rx="12" fill="#131C21" stroke="#26343C"/>
  <rect x="50" y="214" width="4" height="54" rx="2" fill="#F0A03C"/>
  <text x="76" y="237" font-family="'Noto Sans SC','Source Han Sans SC','Microsoft YaHei',sans-serif" font-size="24" fill="#E6EDF1">内存</text>
  <text x="76" y="262" font-family="'JetBrains Mono','Cascadia Mono',Consolas,monospace" font-size="16" fill="#8FA3AD">DRAM</text>
  <text x="244" y="237" font-family="'Noto Sans SC','Source Han Sans SC','Microsoft YaHei',sans-serif" font-size="24" fill="#E6EDF1">频率 + 时序</text>
  <text x="244" y="262" font-family="'Noto Sans SC','Source Han Sans SC','Microsoft YaHei',sans-serif" font-size="17" fill="#8FA3AD">带宽与延迟</text>
  <text x="516" y="242" font-family="'JetBrains Mono','Cascadia Mono',Consolas,monospace" font-size="17" fill="#8FA3AD">XMP / DRAM Frequency</text>
  <line x1="760" y1="241" x2="884" y2="241" stroke="#33454F" stroke-width="6" stroke-linecap="round"/>
  <circle cx="796" cy="241" r="5" fill="#566B76"/>
  <rect x="802" y="235" width="66" height="12" rx="6" fill="#F0A03C"/>

  <!-- Row 3 iGPU -->
  <rect x="48" y="296" width="864" height="86" rx="12" fill="#131C21" stroke="#26343C"/>
  <rect x="50" y="312" width="4" height="54" rx="2" fill="#F0A03C"/>
  <text x="76" y="335" font-family="'Noto Sans SC','Source Han Sans SC','Microsoft YaHei',sans-serif" font-size="24" fill="#E6EDF1">核显</text>
  <text x="76" y="360" font-family="'JetBrains Mono','Cascadia Mono',Consolas,monospace" font-size="16" fill="#8FA3AD">iGPU</text>
  <text x="244" y="335" font-family="'Noto Sans SC','Source Han Sans SC','Microsoft YaHei',sans-serif" font-size="24" fill="#E6EDF1">iGPU 倍频</text>
  <text x="244" y="360" font-family="'Noto Sans SC','Source Han Sans SC','Microsoft YaHei',sans-serif" font-size="17" fill="#8FA3AD">核显频率</text>
  <text x="516" y="340" font-family="'JetBrains Mono','Cascadia Mono',Consolas,monospace" font-size="17" fill="#8FA3AD">GT Ratio / GPU Boost</text>
  <line x1="760" y1="339" x2="884" y2="339" stroke="#33454F" stroke-width="6" stroke-linecap="round"/>
  <circle cx="796" cy="339" r="5" fill="#566B76"/>
  <rect x="802" y="333" width="66" height="12" rx="6" fill="#F0A03C"/>

  <!-- Row 4 Cache -->
  <rect x="48" y="394" width="864" height="86" rx="12" fill="#10181D" stroke="#4FC3D9" stroke-dasharray="7 6" opacity="0.92"/>
  <rect x="50" y="410" width="4" height="54" rx="2" fill="#4FC3D9"/>
  <text x="76" y="433" font-family="'Noto Sans SC','Source Han Sans SC','Microsoft YaHei',sans-serif" font-size="24" fill="#C9D8DE">缓存 Ring</text>
  <text x="76" y="458" font-family="'Noto Sans SC','Source Han Sans SC','Microsoft YaHei',sans-serif" font-size="17" fill="#7C929C">隐性对象</text>
  <text x="244" y="433" font-family="'Noto Sans SC','Source Han Sans SC','Microsoft YaHei',sans-serif" font-size="24" fill="#C9D8DE">Ring 倍频</text>
  <text x="244" y="458" font-family="'Noto Sans SC','Source Han Sans SC','Microsoft YaHei',sans-serif" font-size="17" fill="#7C929C">缓存频率</text>
  <text x="516" y="438" font-family="'JetBrains Mono','Cascadia Mono',Consolas,monospace" font-size="17" fill="#7C929C">CPU Cache Ratio</text>
  <line x1="760" y1="437" x2="884" y2="437" stroke="#2E4049" stroke-width="6" stroke-linecap="round" stroke-dasharray="2 7"/>
  <circle cx="796" cy="437" r="5" fill="#4E626C"/>
  <rect x="802" y="431" width="42" height="12" rx="6" fill="#4FC3D9" opacity="0.65"/>

  <text x="48" y="524" font-family="'Noto Sans SC','Source Han Sans SC','Microsoft YaHei',sans-serif" font-size="19" fill="#8FA3AD">缓存不直接改核心频率，但影响核心访问 L3 与内存的延迟。</text>
</svg>
