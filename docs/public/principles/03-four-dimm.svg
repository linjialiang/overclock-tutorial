<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-labelledby="figP03C-title figP03C-desc">
  <title id="figP03C-title">两条与四条 DIMM 的差别</title>
  <desc id="figP03C-desc">两条内存时每条通道只挂一个 DIMM，四条时每通道挂两个，信号负载翻倍、IMC 训练余量更小；四条通常需要更多电压或更松时序，更难稳，但不是更快。</desc>
  <defs>
    <pattern id="figP03C-grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#1B262C"/>
    </pattern>
    <pattern id="figP03C-grid-major" width="96" height="96" patternUnits="userSpaceOnUse">
      <path d="M96 0H0V96" fill="none" stroke="#233139"/>
    </pattern>
  </defs>

  <rect width="960" height="560" rx="18" fill="#0E1317"/>
  <rect width="960" height="560" rx="18" fill="url(#figP03C-grid)"/>
  <rect width="960" height="560" rx="18" fill="url(#figP03C-grid-major)"/>
  <rect x="0.5" y="0.5" width="959" height="559" rx="18" fill="none" stroke="#2A3A43"/>

  <text x="48" y="50" font-family="'JetBrains Mono','Cascadia Mono',Consolas,monospace" font-size="20" fill="#F0A03C" letter-spacing="1">FIG.P03-03</text>
  <text x="202" y="51" font-family="'Noto Sans SC','Source Han Sans SC','Microsoft YaHei',sans-serif" font-size="24" fill="#E6EDF1">两条与四条 DIMM</text>
  <text x="912" y="50" text-anchor="end" font-family="'JetBrains Mono','Cascadia Mono',Consolas,monospace" font-size="18" fill="#8FA3AD">CH.03</text>
  <path d="M48 72H912" stroke="#2A3A43"/>

  <!-- 2 条 -->
  <rect x="48" y="96" width="408" height="276" rx="18" fill="#131C21" stroke="#26343C"/>
  <text x="76" y="136" font-family="'Noto Sans SC','Source Han Sans SC','Microsoft YaHei',sans-serif" font-size="20" fill="#E6EDF1">2 条（每通道 1 条）</text>

  <rect x="124" y="160" width="34" height="120" rx="5" fill="#141D22" stroke="#2E4049" stroke-dasharray="6 5"/>
  <rect x="198" y="160" width="34" height="120" rx="5" fill="#F0A03C" opacity="0.85"/>
  <rect x="272" y="160" width="34" height="120" rx="5" fill="#141D22" stroke="#2E4049" stroke-dasharray="6 5"/>
  <rect x="346" y="160" width="34" height="120" rx="5" fill="#F0A03C" opacity="0.85"/>

  <path d="M124 294H232M124 288V300M232 288V300" stroke="#4FC3D9" stroke-width="2"/>
  <text x="178" y="318" text-anchor="middle" font-family="'Noto Sans SC','Source Han Sans SC','Microsoft YaHei',sans-serif" font-size="18" fill="#8FA3AD">通道 A</text>
  <path d="M272 294H380M272 288V300M380 288V300" stroke="#4FC3D9" stroke-width="2"/>
  <text x="326" y="318" text-anchor="middle" font-family="'Noto Sans SC','Source Han Sans SC','Microsoft YaHei',sans-serif" font-size="18" fill="#8FA3AD">通道 B</text>

  <text x="76" y="352" font-family="'Noto Sans SC','Source Han Sans SC','Microsoft YaHei',sans-serif" font-size="19" fill="#74D68C">更容易上高频</text>

  <!-- 4 条 -->
  <rect x="504" y="96" width="408" height="276" rx="18" fill="#131C21" stroke="#26343C"/>
  <text x="532" y="136" font-family="'Noto Sans SC','Source Han Sans SC','Microsoft YaHei',sans-serif" font-size="20" fill="#E6EDF1">4 条（每通道 2 条）</text>

  <rect x="580" y="160" width="34" height="120" rx="5" fill="#4FC3D9" opacity="0.8"/>
  <rect x="654" y="160" width="34" height="120" rx="5" fill="#F0A03C" opacity="0.85"/>
  <rect x="728" y="160" width="34" height="120" rx="5" fill="#4FC3D9" opacity="0.8"/>
  <rect x="802" y="160" width="34" height="120" rx="5" fill="#F0A03C" opacity="0.85"/>

  <path d="M580 294H688M580 288V300M688 288V300" stroke="#4FC3D9" stroke-width="2"/>
  <text x="634" y="318" text-anchor="middle" font-family="'Noto Sans SC','Source Han Sans SC','Microsoft YaHei',sans-serif" font-size="18" fill="#8FA3AD">通道 A</text>
  <path d="M728 294H836M728 288V300M836 288V300" stroke="#4FC3D9" stroke-width="2"/>
  <text x="782" y="318" text-anchor="middle" font-family="'Noto Sans SC','Source Han Sans SC','Microsoft YaHei',sans-serif" font-size="18" fill="#8FA3AD">通道 B</text>

  <text x="532" y="352" font-family="'Noto Sans SC','Source Han Sans SC','Microsoft YaHei',sans-serif" font-size="19" fill="#EF7A6D">蓝色为第二条，负载翻倍</text>

  <!-- 对比 -->
  <rect x="48" y="384" width="864" height="132" rx="18" fill="#131C21" stroke="#26343C"/>
  <text x="76" y="410" font-family="'Noto Sans SC','Source Han Sans SC','Microsoft YaHei',sans-serif" font-size="18" fill="#8FA3AD">项目</text>
  <text x="252" y="410" text-anchor="middle" font-family="'Noto Sans SC','Source Han Sans SC','Microsoft YaHei',sans-serif" font-size="18" fill="#8FA3AD">2 条</text>
  <text x="708" y="410" text-anchor="middle" font-family="'Noto Sans SC','Source Han Sans SC','Microsoft YaHei',sans-serif" font-size="18" fill="#8FA3AD">4 条</text>
  <path d="M76 420H884" stroke="#26343C"/>
  <path d="M480 396V504" stroke="#26343C"/>

  <text x="76" y="448" font-family="'Noto Sans SC','Source Han Sans SC','Microsoft YaHei',sans-serif" font-size="19" fill="#8FA3AD">信号负载</text>
  <text x="252" y="448" text-anchor="middle" font-family="'Noto Sans SC','Source Han Sans SC','Microsoft YaHei',sans-serif" font-size="20" fill="#E6EDF1">1 条 / 通道</text>
  <text x="708" y="448" text-anchor="middle" font-family="'Noto Sans SC','Source Han Sans SC','Microsoft YaHei',sans-serif" font-size="20" fill="#E6EDF1">2 条 / 通道</text>

  <text x="76" y="476" font-family="'Noto Sans SC','Source Han Sans SC','Microsoft YaHei',sans-serif" font-size="19" fill="#8FA3AD">训练余量</text>
  <text x="252" y="476" text-anchor="middle" font-family="'Noto Sans SC','Source Han Sans SC','Microsoft YaHei',sans-serif" font-size="20" fill="#E6EDF1">较大</text>
  <text x="708" y="476" text-anchor="middle" font-family="'Noto Sans SC','Source Han Sans SC','Microsoft YaHei',sans-serif" font-size="20" fill="#E6EDF1">更小</text>

  <text x="76" y="504" font-family="'Noto Sans SC','Source Han Sans SC','Microsoft YaHei',sans-serif" font-size="19" fill="#8FA3AD">结果</text>
  <text x="252" y="504" text-anchor="middle" font-family="'Noto Sans SC','Source Han Sans SC','Microsoft YaHei',sans-serif" font-size="20" fill="#74D68C">更容易稳</text>
  <text x="708" y="504" text-anchor="middle" font-family="'Noto Sans SC','Source Han Sans SC','Microsoft YaHei',sans-serif" font-size="20" fill="#EF7A6D">更难稳，不是更快</text>

  <text x="48" y="544" font-family="'Noto Sans SC','Source Han Sans SC','Microsoft YaHei',sans-serif" font-size="20" fill="#E6EDF1">IMC 决定能带几条，QVL 只是参考；四条插满时目标定保守一点。</text>
</svg>
